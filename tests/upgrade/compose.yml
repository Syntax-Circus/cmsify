name: ${CMSIFY_UPGRADE_RUN_ID}

x-upgrade-labels: &upgrade-labels
  io.syntaxcircus.cmsify.upgrade-test: "true"
  io.syntaxcircus.cmsify.upgrade-run: ${CMSIFY_UPGRADE_RUN_ID}

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  ConnectionStrings__Cmsify: Host=postgres;Port=5432;Database=cmsify;Username=cmsify;Password=${POSTGRES_PASSWORD}
  Storage__Provider: s3
  Storage__S3__BucketName: cmsify-upgrade
  Storage__S3__Region: us-east-1
  Storage__S3__AccessKey: cmsify-fixture-access
  Storage__S3__SecretKey: ${MINIO_ROOT_PASSWORD}
  Storage__S3__ServiceUrl: http://minio:9000
  Webhook__AllowHttp: "false"
  Webhook__RetryIntervalSeconds: "3600"
  Webhook__OutboxPollIntervalSeconds: "3600"
  Webhook__CleanupIntervalSeconds: "86400"
  Scheduler__PublishingIntervalSeconds: "3600"
  Serilog__File__Enabled: "false"
  Api__SwaggerEnabled: "false"

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    platform: linux/amd64
    labels: *upgrade-labels
    environment:
      POSTGRES_DB: cmsify
      POSTGRES_USER: cmsify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmsify -d cmsify"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - upgrade

  minio:
    image: ${MINIO_IMAGE}
    platform: linux/amd64
    labels: *upgrade-labels
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: cmsify-fixture-access
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - minio-data:/data
    networks:
      - upgrade

  baseline-api:
    profiles: ["baseline-api"]
    image: ${BASELINE_API_IMAGE}
    platform: linux/amd64
    labels: *upgrade-labels
    extra_hosts:
      - "fixture-webhook.example.test=203.0.113.10"
    environment:
      <<: *api-environment
      Seed__DefaultWorkspace__Name: Upgrade Fixture
      Seed__DefaultWorkspace__Slug: upgrade-fixture
      Seed__Admin__Email: fixture-admin@example.test
      Seed__Admin__DisplayName: Fixture Admin
      Seed__Admin__Password: ${CMSIFY_FIXTURE_ADMIN_PASSWORD}
      Auth__BcryptCost: "4"
      Secrets__EncryptionKey: ${CMSIFY_FIXTURE_LEGACY_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - upgrade

  candidate-api:
    profiles: ["candidate-api"]
    image: ${CANDIDATE_API_IMAGE:-cmsify-upgrade-candidate:local}
    platform: linux/amd64
    labels: *upgrade-labels
    extra_hosts:
      - "fixture-webhook.example.test=203.0.113.10"
    environment:
      <<: *api-environment
      Seed__Admin__PasswordHash: ${CMSIFY_FIXTURE_ADMIN_PASSWORD_HASH}
      Secrets__EncryptionKey: ${CMSIFY_FIXTURE_LEGACY_KEY}
      Secrets__ActiveKeyId: fixture-candidate
      Secrets__EncryptionKeys__fixture-legacy: ${CMSIFY_FIXTURE_LEGACY_KEY_BASE64}
      Secrets__EncryptionKeys__fixture-candidate: ${CMSIFY_FIXTURE_CANDIDATE_KEY_BASE64}
      Secrets__Rotation__Enabled: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - upgrade

networks:
  upgrade:
    internal: true
    labels: *upgrade-labels

volumes:
  postgres-data:
    labels: *upgrade-labels
  minio-data:
    labels: *upgrade-labels
