services:
  postgres:
    image: postgres:17
    restart: unless-stopped    
    environment:
      POSTGRES_DB: cmsify
      POSTGRES_USER: cmsify
      POSTGRES_PASSWORD: cmsify_dev
    ports:
      - "5411:5432"
    volumes:
      - ./local/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmsify -d cmsify"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Cmsify.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Cmsify: Host=postgres;Port=5432;Database=cmsify;Username=cmsify;Password=cmsify_dev
      Seed__Admin__Password: change-this-temporary-password
      Storage__Provider: local
      Storage__Local__BasePath: /var/cmsify/media
      Media__Operations__ReconciliationIntervalSeconds: "300"
      Media__Operations__LeaseDurationSeconds: "300"
      Media__Operations__BatchSize: "100"
      Media__Operations__RetryBaseSeconds: "30"
      Media__Operations__RetryCapSeconds: "3600"
      Media__Operations__RetentionDays: "30"
      Media__Operations__OrphanGraceHours: "24"
      Media__Operations__AbandonedUploadMinutes: "30"
      Media__Operations__ManagedPrefixes__0: cmsify/media/
      Media__Operations__ManagedPrefixes__1: default/
      Api__SwaggerEnabled: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./local/media:/var/cmsify/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  admin:
    build:
      context: .
      dockerfile: src/Cmsify.Admin/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Admin__ApiBaseUrl: http://api:8080
    depends_on:
      api:
        condition: service_healthy
