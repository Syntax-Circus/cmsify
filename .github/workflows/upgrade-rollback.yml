name: Upgrade and rollback rehearsal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/Cmsify.Infrastructure/**"
      - "src/Cmsify.Api/**"
      - "src/Cmsify.Core/**/Media*.cs"
      - "eng/upgrade-tests/**"
      - "tests/upgrade/**"
      - "**/Dockerfile"
      - "**/compose*.yml"
      - "**/compose*.yaml"
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"
      - ".github/workflows/dotnet-test.yml"
      - ".github/workflows/publish-cmsify.yml"
      - ".github/workflows/upgrade-rollback.yml"
  pull_request:
    paths:
      - "src/Cmsify.Infrastructure/**"
      - "src/Cmsify.Api/**"
      - "src/Cmsify.Core/**/Media*.cs"
      - "eng/upgrade-tests/**"
      - "tests/upgrade/**"
      - "**/Dockerfile"
      - "**/compose*.yml"
      - "**/compose*.yaml"
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"
      - ".github/workflows/dotnet-test.yml"
      - ".github/workflows/publish-cmsify.yml"
      - ".github/workflows/upgrade-rollback.yml"

permissions:
  contents: read

concurrency:
  group: cmsify-upgrade-rollback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-rollback:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_IMAGE: cmsify-upgrade-candidate:${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_VERSION: 1.0.0-ci.${{ github.run_number }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22" }
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with: { driver: docker-container }
      - name: Verify the checked-in fixture
        run: node eng/upgrade-tests/cli.mjs verify-fixture --fixture tests/upgrade/fixtures/v0.1.3
      - name: Build the exact linux/amd64 candidate once
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --cache-from type=gha --cache-to type=gha,mode=max --tag "$CANDIDATE_IMAGE" --build-arg "BUILD_VERSION=$CANDIDATE_VERSION" --build-arg "BUILD_INFORMATIONAL_VERSION=$CANDIDATE_VERSION+$SOURCE_SHA" --build-arg "BUILD_SOURCE_REVISION=$SOURCE_SHA" --file src/Cmsify.Api/Dockerfile --load .
      - name: Check deterministic fixture regeneration
        run: node eng/upgrade-tests/cli.mjs generate-fixture --fixture tests/upgrade/fixtures/v0.1.3 --check
      - name: Run the opt-in full upgrade and rollback rehearsal
        env:
          CMSIFY_UPGRADE_TEST: "1"
          CMSIFY_UPGRADE_CANDIDATE_IMAGE: ${{ env.CANDIDATE_IMAGE }}
          CMSIFY_UPGRADE_CANDIDATE_VERSION: ${{ env.CANDIDATE_VERSION }}
          CMSIFY_UPGRADE_CANDIDATE_SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: node --test tests/upgrade/integration/rehearsal.test.mjs
      - name: Upload sanitized upgrade diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-rollback-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/upgrade-tests/**
          if-no-files-found: ignore
          retention-days: 14
