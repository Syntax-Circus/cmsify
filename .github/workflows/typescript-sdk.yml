name: TypeScript SDK

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "src/Cmsify.Api/**"
      - ".github/workflows/typescript-sdk.yml"
  push:
    branches: [ main ]
    paths:
      - "sdk/typescript/**"
      - "src/Cmsify.Api/**"
      - ".github/workflows/typescript-sdk.yml"

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install
        run: npm ci
      - name: Check generated output
        run: npm run generate:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
