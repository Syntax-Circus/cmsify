name: TypeScript SDK

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "src/Cmsify.Api/**"
      - "scripts/openapi.mjs"
      - ".config/dotnet-tools.json"
      - ".github/workflows/typescript-sdk.yml"
  push:
    branches: [ main ]
    paths:
      - "sdk/typescript/**"
      - "src/Cmsify.Api/**"
      - "scripts/openapi.mjs"
      - ".config/dotnet-tools.json"
      - ".github/workflows/typescript-sdk.yml"

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json
      - name: Install
        run: npm ci
      - name: Restore locked API dependencies
        working-directory: .
        run: dotnet restore src/Cmsify.Api/Cmsify.Api.csproj --locked-mode
      - name: Restore pinned OpenAPI exporter
        run: dotnet tool restore
      - name: Check generated output
        run: npm run generate:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify packed clean consumer
        run: npm run test:consumer
