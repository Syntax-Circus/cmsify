name: TypeScript SDK

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "src/Cmsify.Api/**"
      - "scripts/openapi.mjs"
      - ".config/dotnet-tools.json"
      - ".github/workflows/typescript-sdk.yml"
  push:
    branches: [ main ]
    paths:
      - "sdk/typescript/**"
      - "src/Cmsify.Api/**"
      - "scripts/openapi.mjs"
      - ".config/dotnet-tools.json"
      - ".github/workflows/typescript-sdk.yml"

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install
        run: npm ci
      - name: Restore pinned OpenAPI exporter
        run: dotnet tool restore
      - name: Check generated output
        run: npm run generate:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify packed clean consumer
        run: npm run test:consumer
