name: Build and publish Cmsify packages and Docker images

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Cmsify.slnx
      - run: dotnet build Cmsify.slnx --no-restore --configuration Release
      - run: dotnet test --solution Cmsify.slnx --no-build --configuration Release
      - name: Pack SDK packages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          dotnet pack src/Cmsify.Contracts/Cmsify.Contracts.csproj --no-build --configuration Release --output artifacts
          dotnet pack sdk/dotnet/src/SyntaxCircus.Cmsify.Client/SyntaxCircus.Cmsify.Client.csproj --no-build --configuration Release --output artifacts
          dotnet pack sdk/dotnet/src/SyntaxCircus.Cmsify.Client.DistributedCaching/SyntaxCircus.Cmsify.Client.DistributedCaching.csproj --no-build --configuration Release --output artifacts
      - name: Upload package artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.*nupkg
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write # enable GitHub OIDC token issuance for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Tag published version
        shell: bash
        run: |
          package_path=$(find artifacts -maxdepth 1 -type f -name 'SyntaxCircus.Cmsify.Client.*.nupkg' ! -name '*.snupkg' | head -n 1)
          if [ -z "$package_path" ]; then
            echo "No client package found to derive the release tag."
            exit 1
          fi
          package_name=$(basename "$package_path")
          version=${package_name#SyntaxCircus.Cmsify.Client.}
          version=${version%.nupkg}
          tag="v$version"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "Tag $tag already exists on origin."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"

