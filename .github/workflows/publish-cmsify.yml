name: Certify and promote Cmsify release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: cmsify-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      npm_channel: ${{ steps.release.outputs.npm_channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - id: release
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-list -n 1 "$GITHUB_REF")"
          VERSION="$(node scripts/release/validate-release-tag.mjs "$GITHUB_REF_NAME" --source-sha "$SOURCE_SHA" --require-changelog)"
          if [[ "$VERSION" == *-* ]]; then IS_PRERELEASE=true; NPM_CHANNEL=next; else IS_PRERELEASE=false; NPM_CHANNEL=latest; fi
          printf 'version=%s\nsource_sha=%s\nis_prerelease=%s\nnpm_channel=%s\n' "$VERSION" "$SOURCE_SHA" "$IS_PRERELEASE" "$NPM_CHANNEL" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: ${{ needs.resolve.outputs.source_sha }}, fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.0.0
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: sdk/typescript/package-lock.json }
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with: { driver: docker-container }
      - id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with: { syft-version: v1.42.3 }
      - name: Build source and candidate archives once
        run: |
          dotnet restore Cmsify.slnx
          dotnet build Cmsify.slnx --configuration Release --no-restore -p:Version="$VERSION" -p:InformationalVersion="$VERSION+$SOURCE_SHA"
          dotnet test Cmsify.slnx --configuration Release --no-build --verbosity minimal
          mkdir -p artifacts/nuget
          dotnet pack src/Cmsify.Contracts/Cmsify.Contracts.csproj --configuration Release --no-build --output artifacts/nuget -p:CmsifyReleaseBuild=true -p:PackageVersion="$VERSION" -p:IncludeSymbols=false
          dotnet pack sdk/dotnet/src/SyntaxCircus.Cmsify.Client/SyntaxCircus.Cmsify.Client.csproj --configuration Release --no-build --output artifacts/nuget -p:CmsifyReleaseBuild=true -p:PackageVersion="$VERSION" -p:IncludeSymbols=false
          dotnet pack sdk/dotnet/src/SyntaxCircus.Cmsify.Client.DistributedCaching/SyntaxCircus.Cmsify.Client.DistributedCaching.csproj --configuration Release --no-build --output artifacts/nuget -p:CmsifyReleaseBuild=true -p:PackageVersion="$VERSION" -p:IncludeSymbols=false
      - name: Pack npm candidate once
        working-directory: sdk/typescript
        run: |
          npm ci
          npm pkg delete private
          npm pkg set version="$VERSION"
          npm run generate:check && npm run typecheck && npm test && npm run build
          mkdir -p ../../artifacts/npm && npm pack --pack-destination ../../artifacts/npm
      - name: Build exact OCI layouts once
        run: |
          mkdir -p artifacts/oci
          docker buildx build --platform linux/amd64 --tag "syntaxcircus/cmsify-api:$VERSION" --build-arg "BUILD_VERSION=$VERSION" --build-arg "BUILD_INFORMATIONAL_VERSION=$VERSION+$SOURCE_SHA" --build-arg "BUILD_SOURCE_REVISION=$SOURCE_SHA" --file src/Cmsify.Api/Dockerfile --metadata-file artifacts/oci/cmsify-api.metadata.json --output type=oci,dest=artifacts/oci/cmsify-api.oci.tar,name=syntaxcircus/cmsify-api:$VERSION .
          docker buildx build --platform linux/amd64 --tag "syntaxcircus/cmsify-admin:$VERSION" --build-arg "BUILD_VERSION=$VERSION" --build-arg "BUILD_INFORMATIONAL_VERSION=$VERSION+$SOURCE_SHA" --build-arg "BUILD_SOURCE_REVISION=$SOURCE_SHA" --file src/Cmsify.Admin/Dockerfile --metadata-file artifacts/oci/cmsify-admin.metadata.json --output type=oci,dest=artifacts/oci/cmsify-admin.oci.tar,name=syntaxcircus/cmsify-admin:$VERSION .
      - name: Smoke exact OCI candidates and configuration identity
        shell: bash
        run: |
          docker load --input artifacts/oci/cmsify-api.oci.tar && docker load --input artifacts/oci/cmsify-admin.oci.tar
          docker network create cmsify-smoke
          docker run -d --rm --name cmsify-postgres-smoke --network cmsify-smoke -e POSTGRES_DB=cmsify -e POSTGRES_USER=cmsify -e POSTGRES_PASSWORD=cmsify postgres:17-alpine
          until docker exec cmsify-postgres-smoke pg_isready -U cmsify -d cmsify; do sleep 2; done
          docker run -d --rm --name cmsify-api-smoke --network cmsify-smoke -p 18080:8080 -e ConnectionStrings__Cmsify="Host=cmsify-postgres-smoke;Port=5432;Database=cmsify;Username=cmsify;Password=cmsify" "syntaxcircus/cmsify-api:$VERSION"
          docker run -d --rm --name cmsify-admin-smoke -p 18081:8080 "syntaxcircus/cmsify-admin:$VERSION"
          trap 'docker rm -f cmsify-api-smoke cmsify-admin-smoke cmsify-postgres-smoke; docker network rm cmsify-smoke' EXIT
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:18080/health/live && curl -fsS http://127.0.0.1:18081/ >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/health/live && curl -fsS http://127.0.0.1:18081/ >/dev/null
          for image in "syntaxcircus/cmsify-api:$VERSION" "syntaxcircus/cmsify-admin:$VERSION"; do test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"; test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"; test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = AGPL-3.0-or-later; done
      - name: Generate four named SPDX SBOMs with pinned Syft
        run: |
          mkdir -p artifacts/sbom
          ${{ steps.syft.outputs.cmd }} dir:artifacts/nuget -o spdx-json=artifacts/sbom/cmsify-nuget.spdx.json
          ${{ steps.syft.outputs.cmd }} dir:artifacts/npm -o spdx-json=artifacts/sbom/cmsify-npm.spdx.json
          ${{ steps.syft.outputs.cmd }} docker:syntaxcircus/cmsify-api:$VERSION -o spdx-json=artifacts/sbom/cmsify-api.spdx.json
          ${{ steps.syft.outputs.cmd }} docker:syntaxcircus/cmsify-admin:$VERSION -o spdx-json=artifacts/sbom/cmsify-admin.spdx.json
      - name: Bind OCI descriptors before certification
        shell: bash
        run: |
          API_DIGEST="$(jq -r '."containerimage.descriptor".digest' artifacts/oci/cmsify-api.metadata.json)"; ADMIN_DIGEST="$(jq -r '."containerimage.descriptor".digest' artifacts/oci/cmsify-admin.metadata.json)"
          jq -n --arg version "$VERSION" --arg sourceSha "$SOURCE_SHA" --arg api "$API_DIGEST" --arg admin "$ADMIN_DIGEST" '{version:$version,sourceSha:$sourceSha,oci:{api:{repository:"syntaxcircus/cmsify-api",digest:$api},admin:{repository:"syntaxcircus/cmsify-admin",digest:$admin}}}' > artifacts/release-manifest.json
          (cd artifacts && find . -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum) > artifacts/SHA256SUMS
      - run: node scripts/release/verify-release-artifacts.mjs --artifacts artifacts --version "$VERSION" --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts, if-no-files-found: error, retention-days: 14 }

  dotnet-consumer:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.0.0
        with: { dotnet-version: "10.0.x" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts }
      - run: |
          mkdir consumer && cd consumer && dotnet new console --framework net10.0 --no-restore
          for package in SyntaxCircus.Cmsify.Contracts SyntaxCircus.Cmsify.Client SyntaxCircus.Cmsify.Client.DistributedCaching; do dotnet add package "$package" --version "${{ needs.resolve.outputs.version }}" --source "$GITHUB_WORKSPACE/artifacts/nuget"; done
          dotnet build --configuration Release

  node-consumer:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    strategy: { matrix: { node-version: ["20", "22"] } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: ${{ needs.resolve.outputs.source_sha }}, fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: ${{ matrix.node-version }}, cache: npm, cache-dependency-path: sdk/typescript/package-lock.json }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts }
      - working-directory: sdk/typescript
        run: npm ci && CMSIFY_CLIENT_TARBALL="$GITHUB_WORKSPACE/artifacts/npm/cmsify-client-${{ needs.resolve.outputs.version }}.tgz" npm run test:consumer

  certify:
    needs: [resolve, build, dotnet-consumer, node-consumer]
    runs-on: ubuntu-latest
    permissions: { contents: read, attestations: write, id-token: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts }
      - run: sha256sum --check artifacts/SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-checksums: artifacts/SHA256SUMS }

  promote:
    needs: [resolve, certify]
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: write, id-token: write }
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      NPM_CHANNEL: ${{ needs.resolve.outputs.npm_channel }}
      IS_PRERELEASE: ${{ needs.resolve.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: ${{ needs.resolve.outputs.source_sha }}, fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.0.0
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22", registry-url: https://registry.npmjs.org }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts }
      - name: Revalidate remote tag and certified candidate
        shell: bash
        run: |
          PEELED_SHA="$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | awk '$2 ~ /\^\{\}$/ {print $1}')"
          LIGHTWEIGHT_SHA="$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | awk '$2 !~ /\^\{\}$/ {print $1}')"
          REMOTE_SHA="${PEELED_SHA:-$LIGHTWEIGHT_SHA}"; test -n "$REMOTE_SHA" && test "$REMOTE_SHA" = "$SOURCE_SHA"
          sha256sum --check artifacts/SHA256SUMS
          node scripts/release/verify-release-artifacts.mjs --artifacts artifacts --version "$VERSION" --source-sha "$SOURCE_SHA"
      - name: Install pinned ORAS for candidate descriptor preflight
        shell: bash
        run: |
          curl --fail --location --output /tmp/oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz
          echo '6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64  /tmp/oras.tar.gz' | sha256sum --check
          tar -xzf /tmp/oras.tar.gz -C /tmp oras && sudo install /tmp/oras /usr/local/bin/oras
      - name: Preflight certified OCI descriptors before package promotion
        shell: bash
        run: |
          mkdir -p artifacts/oci/api artifacts/oci/admin && tar -xf artifacts/oci/cmsify-api.oci.tar -C artifacts/oci/api && tar -xf artifacts/oci/cmsify-admin.oci.tar -C artifacts/oci/admin
          API_EXPECTED="$(jq -r '.oci.api.digest' artifacts/release-manifest.json)"; ADMIN_EXPECTED="$(jq -r '.oci.admin.digest' artifacts/release-manifest.json)"
          test "$(oras manifest fetch --descriptor --from-oci-layout "artifacts/oci/api:syntaxcircus/cmsify-api:$VERSION" | jq -r .digest)" = "$API_EXPECTED"
          test "$(oras manifest fetch --descriptor --from-oci-layout "artifacts/oci/admin:syntaxcircus/cmsify-admin:$VERSION" | jq -r .digest)" = "$ADMIN_EXPECTED"
          echo "$DOCKERHUB_TOKEN" | oras login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          for image in syntaxcircus/cmsify-api syntaxcircus/cmsify-admin; do if oras manifest fetch --descriptor "docker.io/$image:$VERSION" 2>oras-error; then exit 1; elif ! grep -Eqi '404|not found' oras-error; then cat oras-error; exit 1; fi; done
        env: { DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}, DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }} }
      - id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with: { user: ${{ secrets.NUGET_USER }} }
      - name: Reject existing NuGet versions before promotion
        shell: bash
        run: |
          for package in syntaxcircus.cmsify.contracts syntaxcircus.cmsify.client syntaxcircus.cmsify.client.distributedcaching; do http_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 20 --max-time 60 "https://api.nuget.org/v3-flatcontainer/$package/$VERSION/$package.$VERSION.nupkg")" || exit 1; case "$http_code" in 404) ;; 200) exit 1 ;; *) echo "Unexpected NuGet preflight HTTP $http_code"; exit 1 ;; esac; done
      - run: dotnet nuget push artifacts/nuget/*.nupkg --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
      - name: Use supported npm OIDC trusted publishing
        run: npm install --global npm@11.11.0 && test "$(npm --version)" = 11.11.0
      - run: npm publish artifacts/npm/*.tgz --access public --provenance --tag "$NPM_CHANNEL"
      - name: Copy certified OCI descriptors and compare remote digests
        shell: bash
        run: |
          echo "$DOCKERHUB_TOKEN" | oras login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          mkdir -p artifacts/oci/api artifacts/oci/admin && tar -xf artifacts/oci/cmsify-api.oci.tar -C artifacts/oci/api && tar -xf artifacts/oci/cmsify-admin.oci.tar -C artifacts/oci/admin
          API_EXPECTED="$(jq -r '.oci.api.digest' artifacts/release-manifest.json)"; ADMIN_EXPECTED="$(jq -r '.oci.admin.digest' artifacts/release-manifest.json)"
          oras cp --from-oci-layout "artifacts/oci/api:syntaxcircus/cmsify-api:$VERSION" "docker.io/syntaxcircus/cmsify-api:$VERSION" && oras cp --from-oci-layout "artifacts/oci/admin:syntaxcircus/cmsify-admin:$VERSION" "docker.io/syntaxcircus/cmsify-admin:$VERSION"
          API_REMOTE="$(oras manifest fetch --descriptor "docker.io/syntaxcircus/cmsify-api:$VERSION" | jq -r .digest)"; ADMIN_REMOTE="$(oras manifest fetch --descriptor "docker.io/syntaxcircus/cmsify-admin:$VERSION" | jq -r .digest)"; test "$API_REMOTE" = "$API_EXPECTED" && test "$ADMIN_REMOTE" = "$ADMIN_EXPECTED"
          printf 'syntaxcircus/cmsify-api@%s\nsyntaxcircus/cmsify-admin@%s\n' "$API_REMOTE" "$ADMIN_REMOTE" > artifacts/OCI-DIGESTS
        env: { DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}, DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }} }
      - name: Create correct prerelease/stable GitHub Release
        env: { GH_TOKEN: ${{ github.token }} }
        shell: bash
        run: |
          args=(); if [ "$IS_PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "v$VERSION" artifacts/SHA256SUMS artifacts/OCI-DIGESTS artifacts/release-manifest.json artifacts/sbom/*.spdx.json --title "Cmsify v$VERSION" --generate-notes --target "$SOURCE_SHA" "${args[@]}"
