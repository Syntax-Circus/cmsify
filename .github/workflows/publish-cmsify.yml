name: Certify and promote Cmsify release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: cmsify-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      npm_channel: ${{ steps.release.outputs.npm_channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - id: release
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-list -n 1 "$GITHUB_REF")"
          VERSION="$(node scripts/release/validate-release-tag.mjs "$GITHUB_REF_NAME" --source-sha "$SOURCE_SHA" --require-changelog)"
          if [[ "$VERSION" == *-* ]]; then IS_PRERELEASE=true; NPM_CHANNEL=next; else IS_PRERELEASE=false; NPM_CHANNEL=latest; fi
          printf 'version=%s\nsource_sha=%s\nis_prerelease=%s\nnpm_channel=%s\n' "$VERSION" "$SOURCE_SHA" "$IS_PRERELEASE" "$NPM_CHANNEL" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: ${{ needs.resolve.outputs.source_sha }}, fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: sdk/typescript/package-lock.json }
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with: { driver: docker-container }
      - id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with: { syft-version: v1.42.3 }
      - name: Build source and candidate archives once
        run: |
          dotnet restore Cmsify.slnx --locked-mode
          dotnet build Cmsify.slnx --configuration Release --no-restore -p:Version="$VERSION" -p:InformationalVersion="$VERSION+$SOURCE_SHA"
          dotnet test Cmsify.slnx --configuration Release --no-build --verbosity minimal
          mkdir -p artifacts/nuget
          dotnet pack src/Cmsify.Contracts/Cmsify.Contracts.csproj --configuration Release --no-build --output artifacts/nuget -p:CmsifyReleaseBuild=true -p:PackageVersion="$VERSION" -p:RepositoryCommit="$SOURCE_SHA" -p:IncludeSymbols=false
          dotnet pack sdk/dotnet/src/SyntaxCircus.Cmsify.Client/SyntaxCircus.Cmsify.Client.csproj --configuration Release --no-build --output artifacts/nuget -p:CmsifyReleaseBuild=true -p:PackageVersion="$VERSION" -p:RepositoryCommit="$SOURCE_SHA" -p:IncludeSymbols=false
          dotnet pack sdk/dotnet/src/SyntaxCircus.Cmsify.Client.DistributedCaching/SyntaxCircus.Cmsify.Client.DistributedCaching.csproj --configuration Release --no-build --output artifacts/nuget -p:CmsifyReleaseBuild=true -p:PackageVersion="$VERSION" -p:RepositoryCommit="$SOURCE_SHA" -p:IncludeSymbols=false
      - name: Pack npm candidate once
        working-directory: sdk/typescript
        run: |
          npm ci
          npm pkg delete private
          npm pkg set version="$VERSION" gitHead="$SOURCE_SHA"
          npm run generate:check && npm run typecheck && npm test && npm run build
          mkdir -p ../../artifacts/npm && npm pack --pack-destination ../../artifacts/npm
      - name: Build exact OCI layouts once
        run: |
          mkdir -p artifacts/oci
          docker buildx build --platform linux/amd64 --provenance=false --tag "syntaxcircus/cmsify-api:$VERSION" --build-arg "BUILD_VERSION=$VERSION" --build-arg "BUILD_INFORMATIONAL_VERSION=$VERSION+$SOURCE_SHA" --build-arg "BUILD_SOURCE_REVISION=$SOURCE_SHA" --file src/Cmsify.Api/Dockerfile --metadata-file artifacts/oci/cmsify-api.metadata.json --output type=oci,dest=artifacts/oci/cmsify-api.oci.tar,name=syntaxcircus/cmsify-api:$VERSION .
          docker buildx build --platform linux/amd64 --provenance=false --tag "syntaxcircus/cmsify-admin:$VERSION" --build-arg "BUILD_VERSION=$VERSION" --build-arg "BUILD_INFORMATIONAL_VERSION=$VERSION+$SOURCE_SHA" --build-arg "BUILD_SOURCE_REVISION=$SOURCE_SHA" --file src/Cmsify.Admin/Dockerfile --metadata-file artifacts/oci/cmsify-admin.metadata.json --output type=oci,dest=artifacts/oci/cmsify-admin.oci.tar,name=syntaxcircus/cmsify-admin:$VERSION .
      - name: Generate four named SPDX SBOMs with pinned Syft
        run: |
          mkdir -p artifacts/sbom
          ${{ steps.syft.outputs.cmd }} dir:artifacts/nuget -o spdx-json=artifacts/sbom/cmsify-nuget.spdx.json
          ${{ steps.syft.outputs.cmd }} dir:artifacts/npm -o spdx-json=artifacts/sbom/cmsify-npm.spdx.json
          ${{ steps.syft.outputs.cmd }} oci-archive:artifacts/oci/cmsify-api.oci.tar -o spdx-json=artifacts/sbom/cmsify-api.spdx.json
          ${{ steps.syft.outputs.cmd }} oci-archive:artifacts/oci/cmsify-admin.oci.tar -o spdx-json=artifacts/sbom/cmsify-admin.spdx.json
          node scripts/release/finalize-spdx.mjs --artifacts artifacts --version "$VERSION" --source-sha "$SOURCE_SHA"
      - name: Bind OCI descriptors before certification
        shell: bash
        run: |
          API_DIGEST="$(jq -r '."containerimage.descriptor".digest' artifacts/oci/cmsify-api.metadata.json)"; ADMIN_DIGEST="$(jq -r '."containerimage.descriptor".digest' artifacts/oci/cmsify-admin.metadata.json)"
          API_SIZE="$(jq -r '."containerimage.descriptor".size' artifacts/oci/cmsify-api.metadata.json)"; ADMIN_SIZE="$(jq -r '."containerimage.descriptor".size' artifacts/oci/cmsify-admin.metadata.json)"
          API_MEDIA="$(jq -r '."containerimage.descriptor".mediaType' artifacts/oci/cmsify-api.metadata.json)"; ADMIN_MEDIA="$(jq -r '."containerimage.descriptor".mediaType' artifacts/oci/cmsify-admin.metadata.json)"
          jq -n --arg version "$VERSION" --arg sourceSha "$SOURCE_SHA" --arg api "$API_DIGEST" --arg admin "$ADMIN_DIGEST" --arg apiSize "$API_SIZE" --arg adminSize "$ADMIN_SIZE" --arg apiMedia "$API_MEDIA" --arg adminMedia "$ADMIN_MEDIA" '{version:$version,sourceSha:$sourceSha,oci:{api:{repository:"syntaxcircus/cmsify-api",ref:("syntaxcircus/cmsify-api:"+$version),digest:$api,size:($apiSize|tonumber),mediaType:$apiMedia,platform:{os:"linux",architecture:"amd64"}},admin:{repository:"syntaxcircus/cmsify-admin",ref:("syntaxcircus/cmsify-admin:"+$version),digest:$admin,size:($adminSize|tonumber),mediaType:$adminMedia,platform:{os:"linux",architecture:"amd64"}}}}' > artifacts/release-manifest.json
          (cd artifacts && find . -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum) > artifacts/SHA256SUMS
      - run: node scripts/release/verify-release-artifacts.mjs --artifacts artifacts --version "$VERSION" --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts, if-no-files-found: error, retention-days: 14 }

  artifact-smoke:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: ${{ needs.resolve.outputs.source_sha }}, fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts }
      - name: Certify the exact loaded release archives with the Task 4 CLI
        shell: bash
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          docker load --input artifacts/oci/cmsify-api.oci.tar
          docker load --input artifacts/oci/cmsify-admin.oci.tar
          node eng/release-smoke/cli.mjs certify --api-image "syntaxcircus/cmsify-api:$VERSION" --admin-image "syntaxcircus/cmsify-admin:$VERSION" --version "$VERSION" --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/cmsify-release-smoke"
      - name: Upload bounded release-smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-smoke-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}
          path: ${{ runner.temp }}/cmsify-release-smoke/evidence.json
          if-no-files-found: warn
          retention-days: 14

  candidate-accessibility:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: ${{ needs.resolve.outputs.source_sha }}, fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: eng/accessibility/package-lock.json }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts }
      - name: Install locked accessibility harness
        run: npm ci --prefix eng/accessibility
      - name: Load and scan the exact Admin candidate
        env: { CMSIFY_ACCESSIBILITY_BROWSER_CHANNEL: chrome }
        shell: bash
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          docker load --input artifacts/oci/cmsify-admin.oci.tar
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then docker logs cmsify-admin-accessibility 2>/dev/null || true; fi
            docker rm -f cmsify-admin-accessibility 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          docker run -d --pull=never --name cmsify-admin-accessibility -p 18081:8080 "syntaxcircus/cmsify-admin:$VERSION"
          node eng/accessibility/run.mjs --url http://127.0.0.1:18081/login --output "$RUNNER_TEMP/cmsify-accessibility"
      - name: Upload bounded candidate accessibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-accessibility-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/cmsify-accessibility/accessibility.json
            ${{ runner.temp }}/cmsify-accessibility/accessibility.junit.xml
          if-no-files-found: warn
          retention-days: 14

  dotnet-consumer:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: ${{ needs.resolve.outputs.source_sha }}, fetch-depth: 1, persist-credentials: false, path: source }
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with: { global-json-file: source/global.json }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts }
      - name: Restore all three candidates through an isolated local source
        env: { VERSION: ${{ needs.resolve.outputs.version }} }
        shell: bash
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          CONSUMER_ROOT="$RUNNER_TEMP/cmsify-dotnet-consumer"
          LOCAL_SOURCE="$CONSUMER_ROOT/candidate-source"
          mkdir -p "$LOCAL_SOURCE"
          for package in SyntaxCircus.Cmsify.Contracts SyntaxCircus.Cmsify.Client SyntaxCircus.Cmsify.Client.DistributedCaching; do
            candidate="$GITHUB_WORKSPACE/artifacts/nuget/$package.$VERSION.nupkg"
            test -f "$candidate"
            cp "$candidate" "$LOCAL_SOURCE/"
          done
          test "$(find "$LOCAL_SOURCE" -maxdepth 1 -type f -name '*.nupkg' | wc -l)" -eq 3
          cd "$CONSUMER_ROOT"
          dotnet new console --framework net10.0 --no-restore
          cat > NuGet.Config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="candidate" value="$LOCAL_SOURCE" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="candidate">
                <package pattern="SyntaxCircus.Cmsify.Contracts" />
                <package pattern="SyntaxCircus.Cmsify.Client" />
                <package pattern="SyntaxCircus.Cmsify.Client.DistributedCaching" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="Microsoft.*" />
                <package pattern="Polly.*" />
                <package pattern="System.*" />
                <package pattern="SyntaxCircus.Http.Resilience" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          for package in SyntaxCircus.Cmsify.Contracts SyntaxCircus.Cmsify.Client SyntaxCircus.Cmsify.Client.DistributedCaching; do
            dotnet add package "$package" --version "$VERSION" --no-restore
          done
          dotnet restore --configfile NuGet.Config --packages "$CONSUMER_ROOT/package-cache" --no-http-cache
          dotnet build --configuration Release --no-restore

  node-consumer:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    strategy: { matrix: { node-version: ["20", "22"] } }
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: ${{ matrix.node-version }} }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts }
      - name: Install only the candidate tarball and its declared dependencies
        env: { VERSION: ${{ needs.resolve.outputs.version }} }
        shell: bash
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          CONSUMER_ROOT="$RUNNER_TEMP/cmsify-node-consumer-${{ matrix.node-version }}"
          TARBALL="$GITHUB_WORKSPACE/artifacts/npm/cmsify-client-$VERSION.tgz"
          test -f "$TARBALL"
          mkdir -p "$CONSUMER_ROOT" && cd "$CONSUMER_ROOT"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL"
          node --eval 'const lock=require("./package-lock.json"); const dependencies=lock.packages[""].dependencies; if(Object.keys(dependencies).length!==1 || !dependencies["@cmsify/client"].startsWith("file:")) process.exit(1); const candidate=lock.packages["node_modules/@cmsify/client"]; if(candidate.version!==process.env.VERSION || candidate.dependencies["openapi-fetch"]===undefined) process.exit(1)'
          node --input-type=module --eval 'const sdk=await import("@cmsify/client"); if(typeof sdk.CmsifyClient!=="function" || typeof sdk.createCmsifyFetchClient!=="function") process.exit(1)'
          npm ls --all

  upgrade-rollback:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      CANDIDATE_IMAGE: syntaxcircus/cmsify-api:${{ needs.resolve.outputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: ${{ needs.resolve.outputs.source_sha }}, fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts }
      - name: Load and verify the exact release candidate
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          node eng/upgrade-tests/cli.mjs verify-release-baseline --fixture tests/upgrade/fixtures/v0.1.3 --candidate-version "$VERSION" --github-token-env GITHUB_TOKEN
          node eng/upgrade-tests/cli.mjs verify-fixture --fixture tests/upgrade/fixtures/v0.1.3
          FIXTURE_MANIFEST="tests/upgrade/fixtures/v0.1.3/manifest.json"
          BASELINE_API_IMAGE="$(jq -er '.baseline.apiImage | "\(.repository)@\(.digest)"' "$FIXTURE_MANIFEST")"
          POSTGRES_IMAGE="$(jq -er '.baseline.postgresImage | "\(.repository)@\(.digest)"' "$FIXTURE_MANIFEST")"
          MINIO_IMAGE="$(jq -er '.baseline.minioImage | "\(.repository)@\(.digest)"' "$FIXTURE_MANIFEST")"
          docker pull --platform linux/amd64 "$BASELINE_API_IMAGE"
          docker pull --platform linux/amd64 "$POSTGRES_IMAGE"
          docker pull --platform linux/amd64 "$MINIO_IMAGE"
          docker load --input artifacts/oci/cmsify-api.oci.tar
          node eng/upgrade-tests/cli.mjs rehearse --fixture tests/upgrade/fixtures/v0.1.3 --candidate-image "$CANDIDATE_IMAGE" --candidate-version "$VERSION" --candidate-source-sha "$SOURCE_SHA"
      - name: Upload sanitized upgrade diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-upgrade-rollback-diagnostics-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}
          path: artifacts/upgrade-tests/**
          if-no-files-found: ignore
          retention-days: 14

  certify:
    needs: [resolve, build, artifact-smoke, candidate-accessibility, dotnet-consumer, node-consumer, upgrade-rollback]
    runs-on: ubuntu-latest
    permissions: { contents: read, attestations: write, id-token: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts }
      - run: (cd artifacts && sha256sum --check SHA256SUMS)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-checksums: artifacts/SHA256SUMS }

  promote:
    needs: [resolve, certify]
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: write, id-token: write }
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      NPM_CHANNEL: ${{ needs.resolve.outputs.npm_channel }}
      IS_PRERELEASE: ${{ needs.resolve.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: ${{ needs.resolve.outputs.source_sha }}, fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22", registry-url: https://registry.npmjs.org }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v3.0.6 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-candidate-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}, path: artifacts }
      - name: Revalidate remote tag and certified candidate
        shell: bash
        run: |
          PEELED_SHA="$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | awk '$2 ~ /\^\{\}$/ {print $1}')"
          LIGHTWEIGHT_SHA="$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | awk '$2 !~ /\^\{\}$/ {print $1}')"
          REMOTE_SHA="${PEELED_SHA:-$LIGHTWEIGHT_SHA}"; test -n "$REMOTE_SHA" && test "$REMOTE_SHA" = "$SOURCE_SHA"
          (cd artifacts && sha256sum --check SHA256SUMS)
          node scripts/release/verify-release-artifacts.mjs --artifacts artifacts --version "$VERSION" --source-sha "$SOURCE_SHA"
      - name: Install pinned ORAS for candidate descriptor preflight
        shell: bash
        run: |
          curl --fail --location --output /tmp/oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz
          echo '6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64  /tmp/oras.tar.gz' | sha256sum --check
          tar -xzf /tmp/oras.tar.gz -C /tmp oras && sudo install /tmp/oras /usr/local/bin/oras
      - name: Preflight certified OCI descriptors before package promotion
        shell: bash
        run: |
          mkdir -p artifacts/oci/api artifacts/oci/admin && tar -xf artifacts/oci/cmsify-api.oci.tar -C artifacts/oci/api && tar -xf artifacts/oci/cmsify-admin.oci.tar -C artifacts/oci/admin
          API_EXPECTED="$(jq -r '.oci.api.digest' artifacts/release-manifest.json)"; ADMIN_EXPECTED="$(jq -r '.oci.admin.digest' artifacts/release-manifest.json)"
          test "$(oras manifest fetch --descriptor --oci-layout-path artifacts/oci/api "syntaxcircus/cmsify-api:$VERSION" | jq -r .digest)" = "$API_EXPECTED"
          test "$(oras manifest fetch --descriptor --oci-layout-path artifacts/oci/admin "syntaxcircus/cmsify-admin:$VERSION" | jq -r .digest)" = "$ADMIN_EXPECTED"
          echo "$DOCKERHUB_TOKEN" | oras login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          ACCEPT_MANIFESTS="application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json"
          for image in syntaxcircus/cmsify-api syntaxcircus/cmsify-admin; do
            bearer="$(curl --fail --silent --show-error --connect-timeout 20 --max-time 60 --user "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$image:pull,push" | jq -er .token)" || exit 1
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 20 --max-time 60 --header "Authorization: Bearer $bearer" --header "Accept: $ACCEPT_MANIFESTS" "https://registry-1.docker.io/v2/$image/manifests/$VERSION")" || exit 1
            case "$status" in 404) ;; *) echo "OCI tag must be absent; registry returned HTTP $status"; exit 1 ;; esac
          done
        env: { DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}, DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }} }
      - id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with: { user: ${{ secrets.NUGET_USER }} }
      - name: Reject existing NuGet versions before promotion
        shell: bash
        run: |
          for package in syntaxcircus.cmsify.contracts syntaxcircus.cmsify.client syntaxcircus.cmsify.client.distributedcaching; do http_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 20 --max-time 60 "https://api.nuget.org/v3-flatcontainer/$package/$VERSION/$package.$VERSION.nupkg")" || exit 1; case "$http_code" in 404) ;; 200) exit 1 ;; *) echo "Unexpected NuGet preflight HTTP $http_code"; exit 1 ;; esac; done
      - name: Reject existing npm exact version before promotion
        shell: bash
        run: |
          npm_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 20 --max-time 60 "https://registry.npmjs.org/@cmsify%2Fclient/$VERSION")" || exit 1
          case "$npm_status" in 404) ;; *) echo "npm version must be absent; registry returned HTTP $npm_status"; exit 1 ;; esac
      - name: Copy certified OCI descriptors and compare remote digests
        shell: bash
        env:
          COSIGN_YES: "true"
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | oras login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          API_EXPECTED="$(jq -r '.oci.api.digest' artifacts/release-manifest.json)"; ADMIN_EXPECTED="$(jq -r '.oci.admin.digest' artifacts/release-manifest.json)"
          oras cp --from-oci-layout-path artifacts/oci/api "syntaxcircus/cmsify-api:$VERSION" "docker.io/syntaxcircus/cmsify-api:$VERSION"
          oras cp --from-oci-layout-path artifacts/oci/admin "syntaxcircus/cmsify-admin:$VERSION" "docker.io/syntaxcircus/cmsify-admin:$VERSION"
          API_REMOTE="$(oras manifest fetch --descriptor "docker.io/syntaxcircus/cmsify-api:$VERSION" | jq -r .digest)"; ADMIN_REMOTE="$(oras manifest fetch --descriptor "docker.io/syntaxcircus/cmsify-admin:$VERSION" | jq -r .digest)"
          test "$API_REMOTE" = "$API_EXPECTED" && test "$ADMIN_REMOTE" = "$ADMIN_EXPECTED"
          API_SUBJECT="docker.io/syntaxcircus/cmsify-api@$API_REMOTE"; ADMIN_SUBJECT="docker.io/syntaxcircus/cmsify-admin@$ADMIN_REMOTE"
          CERTIFICATE_IDENTITY="https://github.com/$GITHUB_WORKFLOW_REF"
          cosign sign --yes "$API_SUBJECT"
          cosign sign --yes "$ADMIN_SUBJECT"
          cosign verify --certificate-identity "$CERTIFICATE_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$API_SUBJECT"
          cosign verify --certificate-identity "$CERTIFICATE_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ADMIN_SUBJECT"
          printf 'syntaxcircus/cmsify-api@%s\nsyntaxcircus/cmsify-admin@%s\n' "$API_REMOTE" "$ADMIN_REMOTE" > artifacts/OCI-DIGESTS
      - run: dotnet nuget push artifacts/nuget/*.nupkg --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
      - name: Use supported npm OIDC trusted publishing
        run: npm install --global npm@11.11.0 && test "$(npm --version)" = 11.11.0
      - run: npm publish artifacts/npm/*.tgz --access public --provenance --tag "$NPM_CHANNEL"
      - name: Create correct prerelease/stable GitHub Release
        env: { GH_TOKEN: ${{ github.token }} }
        shell: bash
        run: |
          args=(); if [ "$IS_PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "v$VERSION" artifacts/SHA256SUMS artifacts/OCI-DIGESTS artifacts/release-manifest.json artifacts/sbom/*.spdx.json --title "Cmsify v$VERSION" --generate-notes --target "$SOURCE_SHA" "${args[@]}"
