name: .NET tests

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Cmsify.slnx --locked-mode
      - name: Build Release binaries
        run: dotnet build Cmsify.slnx --configuration Release --no-restore --no-incremental
      - name: Run full test suite
        run: dotnet test Cmsify.slnx --configuration Release --no-build --verbosity minimal -p:DisableGitVersionTask=true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Pack and qualify the engine as an isolated consumer
        run: |
          VERSION=0.0.0-package-test
          dotnet build src/Cmsify.Infrastructure.Sqlite/Cmsify.Infrastructure.Sqlite.csproj --configuration Release --no-restore -p:CmsifyReleaseBuild=true -p:Version="$VERSION"
          dotnet pack src/Cmsify.Core/Cmsify.Core.csproj --configuration Release --no-build --output artifacts/nuget -p:CmsifyReleaseBuild=true -p:PackageVersion="$VERSION" -p:RepositoryCommit="$GITHUB_SHA" -p:IncludeSymbols=false -p:WarningsNotAsErrors=NU5104
          dotnet pack src/Cmsify.Infrastructure/Cmsify.Infrastructure.csproj --configuration Release --no-build --output artifacts/nuget -p:CmsifyReleaseBuild=true -p:PackageVersion="$VERSION" -p:RepositoryCommit="$GITHUB_SHA" -p:IncludeSymbols=false -p:WarningsNotAsErrors=NU5104
          dotnet pack src/Cmsify.Infrastructure.Sqlite/Cmsify.Infrastructure.Sqlite.csproj --configuration Release --no-build --output artifacts/nuget -p:CmsifyReleaseBuild=true -p:PackageVersion="$VERSION" -p:RepositoryCommit="$GITHUB_SHA" -p:IncludeSymbols=false -p:WarningsNotAsErrors=NU5104
          node --test scripts/release/engine-package-graph.test.mjs
          node scripts/release/verify-engine-packages.mjs --packages artifacts/nuget --version "$VERSION" --source-sha "$GITHUB_SHA"
      - name: Collect raw coverage
        if: github.event_name != 'pull_request'
        run: dotnet test Cmsify.slnx --configuration Release --no-build --coverage --coverage-output-format cobertura --results-directory artifacts/coverage --verbosity minimal
      - name: Summarize coverage
        if: github.event_name != 'pull_request'
        run: node scripts/quality/summarize-coverage.mjs --input artifacts/coverage --json artifacts/coverage/summary.json --markdown artifacts/coverage/summary.md
      - name: Publish coverage summary
        if: github.event_name != 'pull_request'
        run: cat artifacts/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw coverage reports
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-coverage-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage/**/*.cobertura.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage summary
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-coverage-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage/summary.json
            artifacts/coverage/summary.md
          if-no-files-found: error
          retention-days: 14
      - name: Run API capacity invariants
        if: github.event_name != 'pull_request'
        run: dotnet test tests/Cmsify.Api.Integration.Tests/Cmsify.Api.Integration.Tests.csproj --configuration Release --no-build --filter Category=Capacity
      - name: Run Infrastructure capacity invariants
        if: github.event_name != 'pull_request'
        run: dotnet test tests/Cmsify.Infrastructure.Tests/Cmsify.Infrastructure.Tests.csproj --configuration Release --no-build --filter Category=Capacity
      - name: Run .NET client capacity invariants
        if: github.event_name != 'pull_request'
        run: dotnet test sdk/dotnet/tests/SyntaxCircus.Cmsify.Client.Tests/SyntaxCircus.Cmsify.Client.Tests.csproj --configuration Release --no-build --filter Category=Capacity
