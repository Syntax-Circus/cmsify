name: .NET tests

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Cmsify.slnx --locked-mode
      - name: Build Release binaries
        run: dotnet build Cmsify.slnx --configuration Release --no-restore --no-incremental
      - name: Run full test suite
        run: dotnet test Cmsify.slnx --configuration Release --no-build --verbosity minimal -p:DisableGitVersionTask=true
      - name: Collect raw coverage
        if: github.event_name != 'pull_request'
        run: dotnet test Cmsify.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage --verbosity minimal
      - name: Summarize coverage
        if: github.event_name != 'pull_request'
        run: node scripts/quality/summarize-coverage.mjs --input artifacts/coverage --json artifacts/coverage/summary.json --markdown artifacts/coverage/summary.md
      - name: Publish coverage summary
        if: github.event_name != 'pull_request'
        run: cat artifacts/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw coverage reports
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-coverage-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage summary
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-coverage-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage/summary.json
            artifacts/coverage/summary.md
          if-no-files-found: error
          retention-days: 14
      - name: Run API capacity invariants
        if: github.event_name != 'pull_request'
        run: dotnet test tests/Cmsify.Api.Integration.Tests/Cmsify.Api.Integration.Tests.csproj --configuration Release --no-build --filter Category=Capacity
      - name: Run Infrastructure capacity invariants
        if: github.event_name != 'pull_request'
        run: dotnet test tests/Cmsify.Infrastructure.Tests/Cmsify.Infrastructure.Tests.csproj --configuration Release --no-build --filter Category=Capacity
      - name: Run .NET client capacity invariants
        if: github.event_name != 'pull_request'
        run: dotnet test sdk/dotnet/tests/SyntaxCircus.Cmsify.Client.Tests/SyntaxCircus.Cmsify.Client.Tests.csproj --configuration Release --no-build --filter Category=Capacity
