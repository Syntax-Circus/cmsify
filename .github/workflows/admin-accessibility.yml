name: Admin accessibility

on:
  workflow_dispatch:

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      # Public restore remains gated on publication/replacement of SyntaxCircus.Http.Resilience 0.2.0-cmsify.1.
      - name: Restore locked dependencies
        run: dotnet restore Cmsify.slnx --locked-mode
      - name: Run admin
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          nohup dotnet run --no-restore --no-launch-profile --project src/Cmsify.Admin/Cmsify.Admin.csproj --urls http://127.0.0.1:5177 > admin.log 2>&1 &
          echo $! > admin.pid
          npx --yes wait-on --timeout 60000 http-get://127.0.0.1:5177/login
      - name: Run axe-core smoke checks
        run: |
          npx --yes @axe-core/cli http://127.0.0.1:5177/login \
            --exit \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa
      - name: Print admin log on failure
        if: failure()
        run: cat admin.log
      - name: Stop admin
        if: always()
        run: |
          if [ -f admin.pid ]; then
            kill "$(cat admin.pid)" || true
          fi
