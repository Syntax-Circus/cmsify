name: Admin accessibility

on:
  workflow_dispatch:

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore
        run: dotnet restore Cmsify.slnx
      - name: Run admin
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          nohup dotnet run --no-launch-profile --project src/Cmsify.Admin/Cmsify.Admin.csproj --urls http://127.0.0.1:5177 > admin.log 2>&1 &
          echo $! > admin.pid
          npx --yes wait-on --timeout 60000 http-get://127.0.0.1:5177/login
      - name: Run axe-core smoke checks
        run: |
          npx --yes @axe-core/cli http://127.0.0.1:5177/login \
            --exit \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa
      - name: Print admin log on failure
        if: failure()
        run: cat admin.log
      - name: Stop admin
        if: always()
        run: |
          if [ -f admin.pid ]; then
            kill "$(cat admin.pid)" || true
          fi
