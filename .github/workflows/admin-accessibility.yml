name: Admin accessibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/Cmsify.Admin/**"
      - "src/Cmsify.Contracts/**"
      - "src/Cmsify.Core/**"
      - "sdk/dotnet/src/SyntaxCircus.Cmsify.Client/**"
      - "eng/accessibility/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "Cmsify.slnx"
      - ".github/workflows/admin-accessibility.yml"
  pull_request:
    paths:
      - "src/Cmsify.Admin/**"
      - "src/Cmsify.Contracts/**"
      - "src/Cmsify.Core/**"
      - "sdk/dotnet/src/SyntaxCircus.Cmsify.Client/**"
      - "eng/accessibility/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "Cmsify.slnx"
      - ".github/workflows/admin-accessibility.yml"

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: eng/accessibility/package-lock.json }
      # Public restore remains gated on publication/replacement of SyntaxCircus.Http.Resilience 0.2.0-cmsify.1.
      - name: Restore and build Admin source
        run: |
          dotnet restore Cmsify.slnx --locked-mode
          dotnet build src/Cmsify.Admin/Cmsify.Admin.csproj --configuration Release --no-restore
      - name: Install locked accessibility harness
        run: npm ci --prefix eng/accessibility
      - name: Run Admin source
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          nohup dotnet run --configuration Release --no-build --no-launch-profile --project src/Cmsify.Admin/Cmsify.Admin.csproj --urls http://127.0.0.1:5177 > admin.log 2>&1 &
          echo $! > admin.pid
      - name: Certify login accessibility
        env: { CMSIFY_ACCESSIBILITY_BROWSER_CHANNEL: chrome }
        run: node eng/accessibility/run.mjs --url http://127.0.0.1:5177/login --output artifacts/accessibility
      - name: Print Admin log on failure
        if: failure()
        run: tail --lines 200 admin.log || true
      - name: Upload bounded accessibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-accessibility-${{ github.sha }}
          path: |
            artifacts/accessibility/accessibility.json
            artifacts/accessibility/accessibility.junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Stop Admin
        if: always()
        run: |
          if [ -f admin.pid ]; then
            kill "$(cat admin.pid)" || true
          fi
