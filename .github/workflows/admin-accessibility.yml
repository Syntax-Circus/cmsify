name: Admin accessibility

on:
  pull_request:
    paths:
      - "src/Cmsify.Admin/**"
      - ".github/workflows/admin-accessibility.yml"
  push:
    branches: [ main ]
    paths:
      - "src/Cmsify.Admin/**"
      - ".github/workflows/admin-accessibility.yml"

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore
        run: dotnet restore Cmsify.slnx
      - name: Run admin
        run: |
          dotnet run --project src/Cmsify.Admin/Cmsify.Admin.csproj --urls http://127.0.0.1:5177 &
          npx wait-on http://127.0.0.1:5177/login
      - name: Run axe-core smoke checks
        run: |
          npx @axe-core/cli http://127.0.0.1:5177/login \
            --exit \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa
