name: Capacity trends

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  capacity-trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Cmsify.slnx --locked-mode
      - name: Build Release binaries
        run: dotnet build Cmsify.slnx --configuration Release --no-restore --no-incremental
      - name: Run capacity trends
        run: node scripts/quality/run-capacity.mjs
      - name: Upload capacity report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capacity-trend-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/capacity/capacity-report.json
          if-no-files-found: error
          retention-days: 30
