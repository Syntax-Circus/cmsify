name: Documentation site

on:
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - "sdk/typescript/README.md"
      - "sdk/dotnet/README.md"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs-pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "sdk/typescript/README.md"
      - "sdk/dotnet/README.md"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs-pages.yml"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - name: Install documentation tooling
        run: python -m pip install --requirement docs-site/requirements.txt
      - name: Stage public documentation
        run: python docs-site/scripts/stage_docs.py
      - name: Build documentation
        run: mkdocs build --strict --config-file docs-site/mkdocs.yml
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs-site/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
