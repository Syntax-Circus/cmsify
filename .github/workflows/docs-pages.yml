name: Documentation site

on:
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - "sdk/typescript/README.md"
      - "sdk/dotnet/README.md"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs-pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "sdk/typescript/README.md"
      - "sdk/dotnet/README.md"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs-pages.yml"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - name: Install documentation tooling
        run: python -m pip install --requirement docs-site/requirements.txt
      - name: Stage public documentation
        run: python docs-site/scripts/stage_docs.py
      - name: Build documentation
        run: mkdocs build --strict --config-file docs-site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs-site/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
