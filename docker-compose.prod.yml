services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmsify}
      POSTGRES_USER: ${POSTGRES_USER:-cmsify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmsify} -d ${POSTGRES_DB:-cmsify}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${CMSIFY_IMAGE_PREFIX:-syntaxcircus}/cmsify-api:${CMSIFY_VERSION:?CMSIFY_VERSION is required}
    env_file:
      - ${CMSIFY_API_KEYRING_ENV_FILE:?CMSIFY_API_KEYRING_ENV_FILE is required}
    ports:
      - "127.0.0.1:${CMSIFY_API_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Cmsify=Host=postgres;Port=5432;Database=${POSTGRES_DB:-cmsify};Username=${POSTGRES_USER:-cmsify};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}
      - Seed__Admin__Email=${SEED_ADMIN_EMAIL:-admin@example.com}
      - Seed__Admin__DisplayName=${SEED_ADMIN_DISPLAY_NAME:-Cmsify Admin}
      - Seed__Admin__Password=${Seed__Admin__Password:?Seed__Admin__Password is required}
      - Secrets__Rotation__Enabled=${Secrets__Rotation__Enabled:-false}
      - Secrets__Rotation__BatchSize=${Secrets__Rotation__BatchSize:-100}
      - Secrets__Rotation__DelaySeconds=${Secrets__Rotation__DelaySeconds:-5}
      - Storage__Provider=${Storage__Provider:-local}
      - Storage__Local__BasePath=/var/cmsify/media
      - Storage__Local__RootPath=/var/cmsify/media
      - Storage__S3__BucketName=${Storage__S3__BucketName:-}
      - Storage__S3__Region=${Storage__S3__Region:-us-east-1}
      - Storage__S3__AccessKey=${Storage__S3__AccessKey:-}
      - Storage__S3__SecretKey=${Storage__S3__SecretKey:-}
      - Storage__S3__ServiceUrl=${Storage__S3__ServiceUrl:-}
      - Api__SwaggerEnabled=${Api__SwaggerEnabled:-false}
      - TrustedProxy__RequireTrustedProxiesInProduction=${TrustedProxy__RequireTrustedProxiesInProduction:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/var/cmsify/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  admin:
    image: ${CMSIFY_IMAGE_PREFIX:-syntaxcircus}/cmsify-admin:${CMSIFY_VERSION:?CMSIFY_VERSION is required}
    ports:
      - "127.0.0.1:${CMSIFY_ADMIN_PORT:-5001}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Admin__ApiBaseUrl: http://api:8080
      Admin__DataProtection__KeysPath: /var/cmsify/admin-keys
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - admin_data_protection_keys:/var/cmsify/admin-keys
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  admin_data_protection_keys:
